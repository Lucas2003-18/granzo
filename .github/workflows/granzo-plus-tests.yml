name: Granzo Plus tests
on:
  push:
    paths: ["granzo-plus/**", ".github/workflows/granzo-plus-tests.yml"]
  pull_request:
    paths: ["granzo-plus/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: granzo-plus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: pip install pip-audit && pip-audit -r requirements.txt || true   # avisa, não bloqueia (S8)
